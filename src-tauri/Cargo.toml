[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App with React"
authors = ["Aleksandr Sokolovskii"]
edition = "2024"
rust-version = "1.97.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Intentional git dependency (not crates.io): project-maintained Rust bindings for
# Microsoft mimalloc 3.x. Pin by tag for reproducible builds; bump tag when updating.
# Docs: https://github.com/amsokol/mimalloc
# Stay on v3.3.2: mimalloc v3.4.0/v3.4.1 crash on macOS (TLS slots 126/127 vs CoreFoundation).
# https://github.com/microsoft/mimalloc/issues/1333
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.3.2" }
# Required with app.macOSPrivateApi for windowEffects (e.g. contentBackground).
# Private APIs can affect Mac App Store / notarization — revisit before distribution.
tauri = { version = "2.11.5", features = ["macos-private-api"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
