[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App with React"
authors = ["Aleksandr Sokolovskii"]
edition = "2024"
rust-version = "1.97.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# depbot: bundle tauri-stack — member: tauri-build
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# agent: ok to patch/minor — macOS TLS crash fixed in v3.4.3 (mimalloc issues/1333).
# Prefer git tag bumps only. Intentional git dependency (not crates.io):
# https://github.com/amsokol/mimalloc
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.4.3" }
# depbot: bundle tauri-stack — member: Cargo tauri (align with catalog @tauri-apps/*)
# Required with app.macOSPrivateApi for windowEffects (e.g. contentBackground).
# Private APIs can affect Mac App Store / notarization — revisit before distribution.
tauri = { version = "2.11.5", features = ["macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# depbot: bundle tauri-stack — member: window-state plugin (keep on Tauri 2.x train)
tauri-plugin-window-state = "2.4.1"


[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"
