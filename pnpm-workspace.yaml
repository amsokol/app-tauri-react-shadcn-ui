packages:
  - "."
allowBuilds:
  esbuild: false
  unrs-resolver: false

catalog:
  "@base-ui/react": =1.6.0
  "@eslint/js": =10.0.1
  "@fontsource-variable/inter": =5.2.8
  "@hugeicons/core-free-icons": =4.2.2
  "@hugeicons/react": =1.1.9
  "@ianvs/prettier-plugin-sort-imports": =4.7.1
  # depbot: bundle tailwind — member: vite plugin (align with tailwindcss)
  "@tailwindcss/vite": =4.3.2
  # depbot: bundle tauri-stack — member: JS API (align with @tauri-apps/cli + Cargo tauri*)
  "@tauri-apps/api": =2.11.1
  # depbot: bundle tauri-stack — member: CLI
  "@tauri-apps/cli": =2.11.4
  "@types/node": =24.13.3
  # depbot: bundle react — member: types (keep with react / react-dom)
  "@types/react": =19.2.17
  "@types/react-dom": =19.2.3
  "@vitejs/plugin-react": =6.0.3
  class-variance-authority: =0.7.1
  clsx: =2.1.1
  eslint: =10.7.0
  eslint-config-prettier: =10.1.8
  eslint-import-resolver-typescript: =4.4.5
  eslint-plugin-import-x: =4.17.1
  eslint-plugin-jsx-a11y: =6.10.2
  eslint-plugin-react: =7.37.5
  eslint-plugin-react-hooks: =7.1.1
  eslint-plugin-react-refresh: =0.5.3
  globals: =17.7.0
  knip: =6.26.0
  markdownlint-cli2: =0.23.0
  prettier: =3.9.5
  prettier-plugin-tailwindcss: =0.8.0
  # depbot: bundle react — keep react + react-dom on the same version
  react: =19.2.7
  react-dom: =19.2.7
  shadcn: =4.13.0
  stylelint: =17.14.0
  stylelint-config-standard: =40.0.0
  stylelint-prettier: =5.0.3
  tailwind-merge: =3.6.0
  # depbot: bundle tailwind — keep tailwindcss + @tailwindcss/vite aligned
  tailwindcss: =4.3.2
  tw-animate-css: =1.4.0
  typescript: =6.0.3
  typescript-eslint: =8.64.0
  vite: =8.1.4

# 2 days — dependency release quarantine (see .cursor/agent/POLICY.md)
minimumReleaseAge: 2880

# security overrides for transitive advisories (dev/tooling graph)
overrides:
  "@babel/core": ">=7.29.1"
  body-parser: ">=2.3.0"
  brace-expansion: ">=5.0.7"
  esbuild: ">=0.28.1"
  fast-uri: ">=3.1.2"
  hono: ">=4.12.25"
  ip-address: ">=10.1.1"
  js-yaml: ">=5.2.1"
  qs: ">=6.15.2"
