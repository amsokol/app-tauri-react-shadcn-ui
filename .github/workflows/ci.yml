name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, audit, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:all

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit
        run: pnpm security:audit
        continue-on-error: true

      - name: Frontend build
        run: pnpm build

  agent-maintain:
    name: Agent maintain (main)
    # Issues/reconcile against default branch only — avoid PR-branch noise.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL || vars.CURSOR_REV_MODEL || vars.CURSOR_VUL_MODEL }}
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: agent
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: agent
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${CURSOR_AGENT_MODEL:-}" ]; then
            echo "::error::Missing variable CURSOR_AGENT_MODEL (or REV/VUL fallback)"
            exit 1
          fi
          echo "CURSOR_AGENT_MODEL=$CURSOR_AGENT_MODEL"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install agent runner
        env:
          RUNNER_REF: ${{ vars.AGENT_RUNNER_REF || vars.DEPBOT_RUNNER_REF || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUNNER_REF" \
            https://github.com/amsokol/ai-devsecops-cursor.git \
            "${{ runner.temp }}/ai-devsecops-cursor"
          cd "${{ runner.temp }}/ai-devsecops-cursor"
          uv sync --frozen

      - name: Agent-maintain ship
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
        run: uv run agent-maintain

  agent-gate:
    name: Agent gate (PR review)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL || vars.CURSOR_REV_MODEL || vars.CURSOR_VUL_MODEL }}
      # Reviews/APPROVE as github-actions[bot]. Do NOT replace with a user PAT.
      GH_TOKEN: ${{ github.token }}
      AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.REVIEWBOT_GH_TOKEN }}
      REVIEWBOT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.REVIEWBOT_GH_TOKEN }}
      AGENT_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${CURSOR_AGENT_MODEL:-}" ]; then
            echo "::error::Missing variable CURSOR_AGENT_MODEL (or REV/VUL fallback)"
            exit 1
          fi
          echo "CURSOR_AGENT_MODEL=$CURSOR_AGENT_MODEL AGENT_PR=$AGENT_PR"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install agent runner
        env:
          RUNNER_REF: ${{ vars.AGENT_RUNNER_REF || vars.DEPBOT_RUNNER_REF || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUNNER_REF" \
            https://github.com/amsokol/ai-devsecops-cursor.git \
            "${{ runner.temp }}/ai-devsecops-cursor"
          cd "${{ runner.temp }}/ai-devsecops-cursor"
          uv sync --frozen

      - name: Agent-gate ship
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
          AGENT_PR: ${{ github.event.pull_request.number }}
        run: uv run agent-gate --pr "$AGENT_PR"
