name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, audit, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:all

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit
        run: pnpm security:audit
        continue-on-error: true

      - name: Frontend build
        run: pnpm build

  agent-maintain:
    name: Agent maintain (main)
    # Issues/reconcile against default branch only — avoid PR-branch noise.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      AGENT_MAINTAIN_MODEL: ${{ vars.AGENT_MAINTAIN_MODEL || vars.CURSOR_AGENT_MODEL || vars.CURSOR_DEP_MODEL || vars.CURSOR_REV_MODEL || vars.CURSOR_VUL_MODEL }}
      AGENT_SCM: github
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: agent
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: agent
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${AGENT_MAINTAIN_MODEL:-}" ]; then
            echo "::error::Missing variable AGENT_MAINTAIN_MODEL (or CURSOR_*_MODEL fallback)"
            exit 1
          fi
          echo "AGENT_MAINTAIN_MODEL=$AGENT_MAINTAIN_MODEL"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.AGENT_WORKFLOW_TOKEN || github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install agent runner
        id: runner
        uses: amsokol/ai-devsecops-cursor/.github/actions/install-agent-runner@v0.3.4
        with:
          runner_ref: ${{ vars.AGENT_RUNNER_REF || 'v0.3.4' }}

      - name: Agent-maintain ship
        working-directory: ${{ steps.runner.outputs.path }}
        env:
          TARGET_PATH: ${{ github.workspace }}
          TARGET_ID: app-tauri-react-shadcn-ui
        run: uv run agent-maintain
