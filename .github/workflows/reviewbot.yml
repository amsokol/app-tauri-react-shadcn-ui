# Manual PR review via Cursor Agent SDK (ai-devsecops-cursor).
# Also runs automatically on pull_request in ci.yml (ship → review / APPROVE).
# Trigger: Actions → reviewbot → Run workflow (dry-run | ship + PR number).
#
# Repo secrets:
#   CURSOR_API_KEY — Cursor Dashboard → Integrations
#   REVIEWBOT_GH_TOKEN — optional PAT for GraphQL resolveReviewThread (GITHUB_TOKEN
#     cannot resolve threads: "Resource not accessible by integration")
#
# Repo variables:
#   CURSOR_REV_MODEL — required (e.g. composer-2.5); runner fails if unset/empty
#   DEPBOT_RUNNER_REF — optional git ref of amsokol/ai-devsecops-cursor (default: main)
#
# Repo Settings → Actions → General → Workflow permissions:
#   - ✅ Allow GitHub Actions to create and approve pull requests
#     (required for APPROVE)

name: reviewbot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (plan only) or ship (post review / APPROVE)"
        required: true
        type: choice
        options:
          - dry-run
          - ship
        default: dry-run
      pr:
        description: "Pull request number"
        required: true
        type: string

concurrency:
  group: reviewbot-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewbot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_REV_MODEL: ${{ vars.CURSOR_REV_MODEL }}
      GH_TOKEN: ${{ secrets.REVIEWBOT_GH_TOKEN || github.token }}
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${CURSOR_REV_MODEL:-}" ]; then
            echo "::error::Missing variable CURSOR_REV_MODEL"
            exit 1
          fi
          if [ -z "${{ inputs.pr }}" ]; then
            echo "::error::Missing PR number"
            exit 1
          fi
          echo "CURSOR_REV_MODEL=$CURSOR_REV_MODEL pr=${{ inputs.pr }}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install reviewbot runner
        env:
          RUNNER_REF: ${{ vars.DEPBOT_RUNNER_REF != '' && vars.DEPBOT_RUNNER_REF || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUNNER_REF" \
            https://github.com/amsokol/ai-devsecops-cursor.git \
            "${{ runner.temp }}/ai-devsecops-cursor"
          cd "${{ runner.temp }}/ai-devsecops-cursor"
          uv sync --frozen

      - name: Reviewbot dry-run
        if: inputs.mode == 'dry-run'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
          REVIEWBOT_PR: ${{ inputs.pr }}
        run: uv run reviewbot-dry-run --pr "$REVIEWBOT_PR"

      - name: Reviewbot ship
        if: inputs.mode == 'ship'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
          REVIEWBOT_PR: ${{ inputs.pr }}
        run: uv run reviewbot-ship --pr "$REVIEWBOT_PR" --yes
