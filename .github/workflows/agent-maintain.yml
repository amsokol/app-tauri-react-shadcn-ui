# Manual maintain run via Cursor Agent SDK (agent-maintain / main_maintain).
# Also runs automatically on push to main in ci.yml (ship → Issues / fix PRs).
# Trigger: Actions → agent-maintain → Run workflow (dry-run | ship).
#
# Repo secrets:
#   CURSOR_API_KEY — Cursor Dashboard → Integrations
#
# Repo variables:
#   CURSOR_AGENT_MODEL — preferred (e.g. composer-2.5)
#   CURSOR_REV_MODEL / CURSOR_VUL_MODEL — fallbacks if unset
#   AGENT_RUNNER_REF — optional git ref of amsokol/ai-devsecops-cursor (default: main);
#     legacy DEPBOT_RUNNER_REF is still accepted
#
# Repo Settings → Actions → General → Workflow permissions:
#   - ✅ Allow GitHub Actions to create and approve pull requests
#     (required for fix PRs)

name: agent-maintain

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (plan only) or ship (Issues / fix PRs / reconcile)"
        required: true
        type: choice
        options:
          - dry-run
          - ship
        default: dry-run

concurrency:
  group: agent-maintain
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent-maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_AGENT_MODEL: ${{ vars.CURSOR_AGENT_MODEL || vars.CURSOR_REV_MODEL || vars.CURSOR_VUL_MODEL }}
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: agent
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: agent
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${CURSOR_AGENT_MODEL:-}" ]; then
            echo "::error::Missing variable CURSOR_AGENT_MODEL (or REV/VUL fallback)"
            exit 1
          fi
          echo "CURSOR_AGENT_MODEL=$CURSOR_AGENT_MODEL"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install agent runner
        env:
          RUNNER_REF: ${{ vars.AGENT_RUNNER_REF || vars.DEPBOT_RUNNER_REF || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUNNER_REF" \
            https://github.com/amsokol/ai-devsecops-cursor.git \
            "${{ runner.temp }}/ai-devsecops-cursor"
          cd "${{ runner.temp }}/ai-devsecops-cursor"
          uv sync --frozen

      - name: Agent-maintain dry-run
        if: inputs.mode == 'dry-run'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
        run: uv run agent-maintain --dry-run

      - name: Agent-maintain ship
        if: inputs.mode == 'ship'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
        run: uv run agent-maintain
