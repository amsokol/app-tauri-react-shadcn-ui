# Manual dependency updates via Cursor Agent SDK (ai-devsecops-cursor).
# Trigger: Actions → depbot → Run workflow (dry-run | ship).
#
# Repo secrets:
#   CURSOR_API_KEY — Cursor Dashboard → Integrations
#
# Repo variables:
#   CURSOR_DEP_MODEL — required (e.g. composer-2.5); runner fails if unset/empty
#   DEPBOT_RUNNER_REF — optional git ref of amsokol/ai-devsecops-cursor (default: main)

name: depbot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (plan only) or ship (mutate + PR)"
        required: true
        type: choice
        options:
          - dry-run
          - ship
        default: dry-run

concurrency:
  group: depbot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  depbot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_DEP_MODEL: ${{ vars.CURSOR_DEP_MODEL }}
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: depbot
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: depbot
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check secrets and vars
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error::Missing secret CURSOR_API_KEY"
            exit 1
          fi
          if [ -z "${CURSOR_DEP_MODEL:-}" ]; then
            echo "::error::Missing variable CURSOR_DEP_MODEL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "CURSOR_DEP_MODEL=$CURSOR_DEP_MODEL"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          # Lockfile lives in the cloned runner under $RUNNER_TEMP, not this repo.
          enable-cache: false

      - name: Install depbot runner
        env:
          RUNNER_REF: ${{ vars.DEPBOT_RUNNER_REF != '' && vars.DEPBOT_RUNNER_REF || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RUNNER_REF" \
            https://github.com/amsokol/ai-devsecops-cursor.git \
            "${{ runner.temp }}/ai-devsecops-cursor"
          cd "${{ runner.temp }}/ai-devsecops-cursor"
          uv sync --frozen

      - name: Depbot dry-run
        if: inputs.mode == 'dry-run'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
        run: uv run depbot-dry-run

      - name: Depbot ship
        if: inputs.mode == 'ship'
        working-directory: ${{ runner.temp }}/ai-devsecops-cursor
        env:
          DEPBOT_TARGET: ${{ github.workspace }}
          TARGET_ID: ${{ github.repository }}
        run: uv run depbot-ship --yes
